<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: the page runs under a phone's notch and home bar;
         the kit pads its nav, layouts and scroll regions by the safe-area
         insets, so nothing important ends up behind them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Browser chrome colour (a phone's status bar / tab strip). These two
         values mirror the --bg seeds in kit/css/ui.css (dark / light) — the
         one place a seed is repeated, because a meta tag cannot read a custom
         property. A custom theme updates them together with its seeds. -->
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
    <title>My Tools | Hub</title>
    <!-- Adjust the path to wherever kit/ lives relative to this page. -->
    <link rel="stylesheet" href="../kit/css/ui.css">

    <script defer src="../kit/js/lib/globals.js"></script>
    <script defer src="../kit/js/lib/icons.js"></script>
    <script defer src="../kit/js/lib/apps.js"></script>
    <script defer src="../kit/js/lib/hotkeys.js"></script>
    <script defer src="../kit/js/lib/color.js"></script>
    <script defer src="../kit/js/components/sac-icon.js"></script>
    <script defer src="../kit/js/components/sac-nav.js"></script>
    <script defer src="../kit/js/components/sac-footer.js"></script>
    <script defer src="../kit/js/components/sac-window.js"></script>
    <script defer src="../kit/js/components/sac-dialog.js"></script>
    <script defer src="../kit/js/components/sac-split.js"></script>
    <script defer src="../kit/js/components/sac-drop-zone.js"></script>
    <script defer src="../kit/js/components/sac-tabs.js"></script>
    <script defer src="../kit/js/components/sac-menu.js"></script>
    <script defer src="../kit/js/components/sac-command-palette.js"></script>
    <script defer src="../kit/js/components/sac-tooltip.js"></script>
    <script defer src="../kit/js/components/sac-toast.js"></script>
    <script defer src="../kit/js/components/sac-progress.js"></script>
    <script defer src="../kit/js/components/sac-spinner.js"></script>
    <script defer src="../kit/js/components/sac-avatar.js"></script>
    <script defer src="../kit/js/components/sac-copy-button.js"></script>
    <script defer src="../kit/js/components/sac-stepper.js"></script>
    <!-- color suite: the picker must load before the field, which embeds it. -->
    <script defer src="../kit/js/components/sac-color-picker.js"></script>
    <script defer src="../kit/js/components/sac-color-field.js"></script>
    <script defer src="../kit/js/components/sac-swatch-grid.js"></script>
    <script defer src="../kit/js/components/sac-theme-toggle.js"></script>
    <script defer src="../kit/js/components/sac-launcher.js"></script>
</head>
<body>
    <!-- On a phone the ribbon shows the app's name as text (app-name, or set
         compact-title); opening the burger brings back the icons — the
         desktop brand row. -->
    <sac-nav brand="MY TOOLS" brand-icon="cube" app-name="HUB"></sac-nav>
    <div class="orb"></div>

    <div class="hub-container">
        <header>
            <h1>MY TOOLS</h1>
            <p class="intro-text">One-line description of the suite.</p>
        </header>

        <!-- The tile grid is composed from the app registry (see the script
             below): one tile per sac.apps.register() call. kind:"page" tiles
             are plain links, kind:"window" tiles open the app in a floating
             <sac-window>. On a phone the grid drops to one column and a
             window app opens maximized below the nav — same markup.

             storage="my-hub" persists user edits — tile order, hidden apps,
             user-added apps — under localStorage "sac.launcher.my-hub" and
             enables the edit mode. Omit the attribute for a fixed grid that
             renders exactly the registry, nothing else. -->
        <sac-launcher storage="my-hub"></sac-launcher>

        <!-- Hand-written tiles remain possible anywhere on the page:
             <a href="#" class="tile" data-app="my-overlay">…</a>
             sac.apps.init() binds every [data-app="<id>"] element. -->
    </div>

    <sac-footer brand="MY TOOLS"></sac-footer>

    <!-- Ctrl-K palette: one tag, no config. Register hub-level commands on
         sac.commands and they show up here. -->
    <sac-command-palette></sac-command-palette>

    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            // Apps: one manifest per app, upserted by id.
            //
            // kind:"page" — the tile is a normal link to its own page.
            sac.apps.register({
                id:          "my-tool",
                name:        "My Tool",
                icon:        "shapes",
                description: "What it does, in one or two sentences.",
                kind:        "page",
                href:        "/my-tool/",
            });

            // kind:"window" — the app ships as ONE custom element in ONE
            // classic script (definition guarded with customElements.get),
            // lazily injected on first open into a floating <sac-window>.
            // Deep link: ?app=my-overlay auto-opens it (URL cleaned after).
            sac.apps.register({
                id:          "my-overlay",
                name:        "My Overlay Tool",
                icon:        "lightbulb",
                description: "Small tool that lives in a window.",
                kind:        "window",
                tag:         "tool-my-overlay",
                src:         "my-overlay/my-overlay.js",
                width:       "500px",
                height:      "750px",
                // accent:   "#10b981",  // optional per-app accent on its window
            });

            sac.apps.init();   // binds [data-app] tiles + ?app= deep links
        });
    </script>
</body>
</html>
